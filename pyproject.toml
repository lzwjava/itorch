[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "itorch"
version = "0.1.0"
description = "A minimal autograd deep learning library (tinygrad-style), numpy only"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["itorch"]